<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<title>Eventos por ciudad | ¿Dónde Hay Salsa?</title>
<meta name="description" content="Cartelera de salsa y ritmos latinos por ciudad: sociales, clases, conciertos y festivales.">
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="container">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>
  </div>

  <section class="hero" style="padding-top:0">
    <div class="container hero__inner" id="ciudad-hero"></div>
  </section>

  <section class="section" id="bloque-cartelera" style="padding-top:0">
    <div class="container">
      <div id="ciudad-filtros" style="margin-bottom:2rem"></div>
      <div class="section-head">
        <div><span class="eyebrow">Cartelera</span><h2>Próximos eventos</h2></div>
        <span class="chip" id="contador">—</span>
      </div>
      <div class="quickfilters" id="quickfilters" role="group" aria-label="Filtros rápidos por fecha"></div>
      <div id="lista-eventos" class="grid-events" aria-live="polite"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="cta reveal">
        <div>
          <span class="eyebrow">Para organizadores</span>
          <h2>¿Organizas eventos en esta ciudad?</h2>
          <p>Publícalo gratis y aparece en esta cartelera.</p>
        </div>
        <a class="btn btn--primary btn--lg" href="publicar.html">PUBLICAR MI EVENTO</a>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/format.js"></script>
<script src="assets/js/data/cities.js"></script>
<script src="assets/js/data/categories.js"></script>
<script src="assets/js/data/events.js"></script>
<script src="assets/js/core/dataSource.js"></script>
<script src="assets/js/components/layout.js"></script>
<script src="assets/js/components/eventCard.js"></script>
<script src="assets/js/components/filters.js"></script>
<script src="assets/js/pages/city.js"></script>
</body>
</html>
